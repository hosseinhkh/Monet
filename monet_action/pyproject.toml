[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monet_action"
version = "0.1.0"
description = "Monet-Action v2 Phase 1: Monet-7B self-fed latent reasoning + compact flow-matching DiT action tool for LIBERO"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # pinned in environment/*.txt; see README

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monet_action = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sim: requires a working LIBERO/robosuite/MuJoCo install",
  "tokenizer: requires the Monet-7B tokenizer/processor files (small, no weights)",
  "gpu: requires a CUDA GPU and the real Monet-7B checkpoint",
  "slow: slower CPU tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["results", "runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
  "E501",  # long lines are allowed where they keep tables / tensor contracts readable
  "E731",  # small lambdas are used for local formatting helpers
  "B905",  # zip(strict=...) not required (py3.10 baseline)
  "B008",  # dataclass field(default_factory=...) patterns
]

[tool.ruff.lint.per-file-ignores]
# CLI entry points call runtime_env.apply_defaults() before importing torch (GPU pinning must precede CUDA init)
"src/monet_action/{train,evaluate,audit,preflight}.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["monet_action"]
known-local-folder = ["conftest", "test_tool_loop"]
