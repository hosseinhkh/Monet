# Two-task closed-loop smoke test (development only; catches convention errors early).
# Uses development init states 30+ so the final-report states 0..29 stay untouched.
_base_: eval.yaml
name: eval_smoke
eval:
  task_ids: [0, 1]
  seeds: [0]
  episodes_per_task: 2
  init_state_policy: fixed
  init_state_offset: 30
  save_videos: 2
